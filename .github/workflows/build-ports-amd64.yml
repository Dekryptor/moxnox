      #       FILE_SIZE=$(stat -c%s "$port.tar.gz")
      #       SHA256=$(sha256sum "$port.tar.gz" | cut -d' ' -f1)
      #
      #       UPLOAD_URL=$(curl --no-progress-meter -X POST "$TWIRP/CreateArtifact" \
      #         -H "Authorization: Bearer ${ACTIONS_RUNTIME_TOKEN}" \
      #         -H "Content-Type: application/json" \
      #         -d "{\"workflow_run_backend_id\":\"$RUN_ID\",\"workflow_job_run_backend_id\":\"$JOB_ID\",\"name\":\"$port.tar.gz\",\"version\":4,\"mime_type\":{\"value\":\"application/gzip\"}}" \
      #         | jq -r '.signedUploadUrl')
      #
      #       curl --no-progress-meter -X PUT "${UPLOAD_URL}&comp=block" \
      #         -H "Content-Type: application/octet-stream" \
      #         --data-binary "@$port.tar.gz"
