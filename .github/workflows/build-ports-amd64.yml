name: build-ports
on:
  push:
    paths: ['ports/**']
concurrency:
  group: build-ports-amd64
jobs:
  compute-ports:
    runs-on: moxnox-ci-amd64
    outputs:
      ports: ${{ steps.compute.outputs.ports }}
      checkout: ${{ steps.compute.outputs.checkout }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch before SHA
        run: git fetch origin ${{ github.event.before }} || true

      - name: Compute ports to rebuild
        id: compute
        run: |
          python3 ports/calcdeps.py ${{ github.event.before }} ${{ github.event.after }} > ports.json
          echo "ports=$(jq -c .build ports.json)" >> $GITHUB_OUTPUT
          echo "checkout=$(jq -c .checkout ports.json)" >> $GITHUB_OUTPUT

  build-port:
    needs: compute-ports
    if: ${{ needs.compute-ports.outputs.ports != '[]' }}
    runs-on: moxnox-ci-amd64
    steps:
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.SHORT_SHA }}
          fetch-depth: 1

      - name: Checkout mingw, musl, and tre
        working-directory: ${{ env.SHORT_SHA }}
        run: |
          git submodule update --init --depth 1 ports/mingw-w64/repo
          git submodule update --init --depth 1 ports/musl/repo
          git submodule update --init --depth 1 ports/tre/repo

      - name: Checkout submodules
        working-directory: ${{ env.SHORT_SHA }}
        run: |
          for port in $(echo '${{ needs.compute-ports.outputs.checkout }}' | jq -r '.[]'); do
            git submodule update --init --depth 1 ports/$port/repo
          done

      - name: Configure
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=native-amd64.cmake \
            -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX= \
            -DCMAKE_COLOR_DIAGNOSTICS=ON \
            -S ${SHORT_SHA} -B work

      - name: Build ports
        run: |
          for port in $(echo '${{ needs.compute-ports.outputs.ports }}' | jq -r '.[]'); do
            echo "Building $port"
            DESTDIR=${PWD}/install/$port cmake --build work --parallel `nproc` --target $port
            DESTDIR=${PWD}/install/$port cmake --build work --parallel `nproc` --target ports/$port/install
            mkdir -p ${PWD}/install/$port
            tar -czf $port.tar.gz -C ${PWD}/install/$port .
          done

      - name: Upload tarballs
        if: github.ref == 'refs/heads/master'
        run: |
          for port in $(echo '${{ needs.compute-ports.outputs.ports }}' | jq -r '.[]'); do
            s3cmd --host=minio.burntcomma.com:443 \
              --host-bucket=minio.burntcomma.com:443 \
              put $port.tar.gz s3://moxnox-packages/amd64/
          done
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.S3_ACCESS_KEY}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.S3_SECRET_KEY}}

      - name: Upload artefacts
        run: |
          TWIRP="${ACTIONS_RESULTS_URL%/}/twirp/github.actions.results.api.v1.ArtifactService"
          SCP=$(echo "$ACTIONS_RUNTIME_TOKEN" | cut -d'.' -f2 | tr '_-' '/+' | \
            awk '{n=length($0)%4; if(n==2)$0=$0"=="; if(n==3)$0=$0"="; print}' | \
            base64 -d 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['scp'])")
          RUN_ID=$(echo "$SCP" | cut -d':' -f2)
          JOB_ID=$(echo "$SCP" | cut -d':' -f3)

          for port in $(echo '${{ needs.compute-ports.outputs.ports }}' | jq -r '.[]'); do
            FILE_SIZE=$(stat -c%s "$port.tar.gz")
            SHA256=$(sha256sum "$port.tar.gz" | cut -d' ' -f1)

            BODY="{\"workflow_run_backend_id\":\"$RUN_ID\",\"workflow_job_run_backend_id\":\"$JOB_ID\",\"name\":\"$port.tar.gz\",\"version\":4,\"mime_type\":\"application/gzip\"}"
            echo "CreateArtifact body: $BODY"
            CREATE_RESP=$(curl --no-progress-meter -X POST "$TWIRP/CreateArtifact" \
              -H "Authorization: Bearer ${ACTIONS_RUNTIME_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$BODY")
            echo "CreateArtifact response: $CREATE_RESP"
            UPLOAD_URL=$(echo "$CREATE_RESP" | jq -r '.signedUploadUrl')

            curl --no-progress-meter -X PUT "${UPLOAD_URL}&comp=block" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$port.tar.gz"

            curl --no-progress-meter -X POST "$TWIRP/FinalizeArtifact" \
              -H "Authorization: Bearer ${ACTIONS_RUNTIME_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"workflow_run_backend_id\":\"$RUN_ID\",\"workflow_job_run_backend_id\":\"$JOB_ID\",\"name\":\"$port.tar.gz\",\"size\":\"$FILE_SIZE\",\"hash\":\"sha256:$SHA256\"}"
          done

  upload-initrd:
    needs: [compute-ports, build-port]
    if: github.ref == 'refs/heads/master'
    runs-on: moxnox-ci-amd64
    concurrency:
      group: minio-upload
    steps:
      - name: Download port tarballs
        run: |
          for port in $(echo '${{ needs.compute-ports.outputs.ports }}' | jq -r '.[]'); do
            s3cmd --host=minio.burntcomma.com:443 \
              --host-bucket=minio.burntcomma.com:443 \
              get s3://moxnox-packages/amd64/$port.tar.gz .
          done
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.S3_ACCESS_KEY}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.S3_SECRET_KEY}}

      - name: Download initrd
        run: |
          s3cmd --host=minio.burntcomma.com:443 \
            --host-bucket=minio.burntcomma.com:443 \
            get s3://ipxe/initrd ${PWD}/initrd
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.S3_ACCESS_KEY}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.S3_SECRET_KEY}}

      - name: Extract initrd
        run: |
          cpio -idm --no-absolute-filenames -D ${PWD}/root < ${PWD}/initrd

      - name: Copy ports
        run: |
          for port in $(echo '${{ needs.compute-ports.outputs.ports }}' | jq -r '.[]'); do
            mkdir -p root/share/pkg/$port

            if [ -f root/share/pkg/$port/manifest ]; then
              xargs -I{} rm -fv "root/{}" < root/share/pkg/$port/manifest
            fi

            tar -xzf $port.tar.gz -C root/

            tar -tzf $port.tar.gz | { grep -v '/$' || true; } > root/share/pkg/$port/manifest
          done

      - name: Repack initrd
        run: |
          cd root && \
          find . -print0 | cpio --null --create --format=newc > ../initrd

      - name: Upload initrd
        run: |
          s3cmd --host=minio.burntcomma.com:443 \
            --host-bucket=minio.burntcomma.com:443 \
            put ${PWD}/initrd s3://ipxe/initrd
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.S3_ACCESS_KEY}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.S3_SECRET_KEY}}
