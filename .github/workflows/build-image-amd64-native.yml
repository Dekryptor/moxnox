name: Build Docker Image
on:
  push:
    paths:
      - 'docker/Dockerfile-amd64-native.build'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          docker build --no-cache --pull \
            -f docker/Dockerfile-amd64-native.build \
            -t registry.burntcomma.com/moxnox-ci-amd64:latest \
            -t registry.burntcomma.com/moxnox-ci-amd64:${{ github.sha }} \
            docker/
          docker push registry.burntcomma.com/moxnox-ci-amd64:latest
          docker push registry.burntcomma.com/moxnox-ci-amd64:${{ github.sha }}
