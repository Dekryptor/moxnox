name: build-ports
on: push
jobs:
  compute-ports:
    runs-on: ubuntu-latest
    outputs:
      ports: ${{ steps.compute.outputs.ports }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch before SHA
        run: git fetch origin ${{ github.event.before }} || true

      - name: Compute ports to rebuild
        id: compute
        run: |
          python3 ports/calcdeps.py ${{ github.event.before }} ${{ github.event.after }} > ports.json
          echo "ports=$(cat ports.json)" >> $GITHUB_OUTPUT

  build-port:
    needs: compute-ports
    if: ${{ needs.compute-ports.outputs.ports != '[]' }}
    runs-on: ubuntu-moxnox
    steps:
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.SHORT_SHA }}
          submodules: recursive
          fetch-depth: 1

      - name: Configure
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=clang-amd64.cmake \
            -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=${PWD}/install \
            -S ${SHORT_SHA} -B work

      - name: Build ports
        run: |
          for port in $(echo '${{ needs.compute-ports.outputs.ports }}' | jq -r '.[]'); do
            echo "Building $port"
            cmake --build work --parallel `nproc` --target ports/$port/all
          done
