name: Build Docker Image
on:
  push:
    paths:
      - 'docker/Dockerfile-aarch64.build'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          docker build \
            -f docker/Dockerfile-aarch64.build \
            -t registry.burntcomma.com/ubuntu-moxnox-aarch64:latest \
            -t registry.burntcomma.com/ubuntu-moxnox-aarch64:${{ github.sha }} \
            docker/
          docker push registry.burntcomma.com/ubuntu-moxnox-aarch64:latest
          docker push registry.burntcomma.com/ubuntu-moxnox-aarch64:${{ github.sha }}
