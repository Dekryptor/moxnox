name: build
on: [push]
jobs:
  x86_64 Clang:
    runs-on: ubuntu-moxnox
    steps:
      - run: echo "SHORT_SHA=`echo ${{ github.sha }} | cut -c1-8`" >> $GITHUB_ENV
      - run: git clone --recurse-submodules https://${{ secrets.GITHUB_TOKEN }}@git.burntcomma.com/${{ github.repository }} ${SHORT_SHA}
      - run: cd ${SHORT_SHA} && git checkout ${{ github.sha }}
      - run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=clang-amd64.cmake \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=${PWD}/install/debug \
            -S ${SHORT_SHA} -B debug-work && \
          cmake --build debug-work --parallel `nproc` && \
          cmake --install debug-work
      - run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=clang-amd64.cmake \
            -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=${PWD}/install/release \
            -S ${SHORT_SHA} -B release-work && \
          cmake --build release-work --parallel `nproc` && \
          cmake --install release-work
      # - uses: actions/upload-artifact@v3
      #   with:
      #     name: ${{ github.sha }}
      #     overwrite: true
      #     path: |
      #       install
      - run: |
          s3cmd --host=minio.burntcomma.com:443 \
            --host-bucket=minio.burntcomma.com:443 \
            put ${PWD}/install/debug/boot s3://ipxe/
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.S3_ACCESS_KEY}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.S3_SECRET_KEY}}
      - run: |
          s3cmd --host=minio.burntcomma.com:443 \
            --host-bucket=minio.burntcomma.com:443 \
            put ${PWD}/install/debug/initrd s3://ipxe/
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.S3_ACCESS_KEY}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.S3_SECRET_KEY}}
