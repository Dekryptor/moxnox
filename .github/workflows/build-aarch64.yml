name: build
on:
  push:
    paths-ignore:
      - 'docker/**'
      - 'ports/**'
jobs:
  aarch64 Clang:
    runs-on: ubuntu-moxnox-aarch64
    steps:
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.SHORT_SHA }}
          fetch-depth: 1

      - name: Checkout submodules
        working-directory: ${{ env.SHORT_SHA }}
        run: |
          git submodule update --init --depth 1 ports/acpica/repo ports/freetype/repo ports/gnu-efi/repo ports/harfbuzz/repo ports/libpng/repo ports/mingw-w64/repo ports/zlib/repo ports/musl/repo

      - name: Configure Debug
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=clang-aarch64.cmake \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=${PWD}/install/debug \
            -DCMAKE_CXX_FLAGS="-isystem /usr/lib/llvm-20/include/c++/v1 -isystem /usr/share/mingw-w64/include" \
            -DCMAKE_C_FLAGS="-isystem /usr/share/mingw-w64/include" \
            -DCMAKE_CXX_LINK_FLAGS="-L/root/llvm-mingw/aarch64-w64-mingw32/lib -L/root/llvm-mingw/lib/clang/20/lib/windows" \
            -DCMAKE_SHARED_LINKER_FLAGS="-nodefaultlibs -L/root/llvm-mingw/aarch64-w64-mingw32/lib -L/root/llvm-mingw/lib/clang/20/lib/windows" \
            -DUSE_COMPILER_RT=ON \
            -S ${SHORT_SHA} -B debug-work

      - name: Build Debug
        run: cmake --build debug-work --parallel `nproc`

      - name: Install Debug
        run: cmake --install debug-work --component core

      - name: Configure RelWithDebInfo
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=clang-aarch64.cmake \
            -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=${PWD}/install/release \
            -DCMAKE_CXX_FLAGS="-isystem /usr/lib/llvm-20/include/c++/v1 -isystem /usr/share/mingw-w64/include" \
            -DCMAKE_C_FLAGS="-isystem /usr/share/mingw-w64/include" \
            -DCMAKE_CXX_LINK_FLAGS="-L/root/llvm-mingw/aarch64-w64-mingw32/lib -L/root/llvm-mingw/lib/clang/20/lib/windows" \
            -DCMAKE_SHARED_LINKER_FLAGS="-nodefaultlibs -L/root/llvm-mingw/aarch64-w64-mingw32/lib -L/root/llvm-mingw/lib/clang/20/lib/windows" \
            -DUSE_COMPILER_RT=ON \
            -S ${SHORT_SHA} -B release-work

      - name: Build RelWithDebInfo
        run: cmake --build release-work --parallel `nproc`

      - name: Install RelWithDebInfo
        run: cmake --install release-work --component core

      # - uses: actions/upload-artifact@v3
      #   with:
      #     name: ${{ github.sha }}
      #     overwrite: true
      #     path: |
      #       install
