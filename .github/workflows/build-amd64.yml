name: build
on:
  push:
    paths-ignore:
      - 'docker/**'
      - 'ports/**'
      - '.gitmodules'
concurrency:
  group: build-amd64
jobs:
  x86_64 GCC:
    runs-on: moxnox-ci-amd64
    container:
      volumes:
        - moxnox-cache:/cache
    steps:
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.SHORT_SHA }}
          fetch-depth: 1

      - name: Checkout submodules
        working-directory: ${{ env.SHORT_SHA }}
        env:
          GIT_CONFIG_GLOBAL: ${{ github.workspace }}/${{ env.SHORT_SHA }}/.github/gitconfig
        run: |
          git submodule update --init --depth 1 ports/acpica/repo ports/freetype/repo ports/gnu-efi/repo ports/harfbuzz/repo ports/libpng/repo ports/mingw-w64/repo ports/zlib/repo ports/musl/repo ports/tre/repo ports/libxkbcommon/repo

      - name: Configure Debug
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=amd64.cmake \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_COLOR_DIAGNOSTICS=ON \
            -DCMAKE_INSTALL_PREFIX=${PWD}/install/debug \
            -S ${SHORT_SHA} -B debug-work

      - name: Build Debug
        run: cmake --build debug-work --parallel `nproc`

      - name: Install Debug
        run: cmake --install debug-work --component core

      - name: Configure RelWithDebInfo
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=amd64.cmake \
            -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_COLOR_DIAGNOSTICS=ON \
            -DCMAKE_INSTALL_PREFIX=${PWD}/install/release \
            -S ${SHORT_SHA} -B release-work

      - name: Build RelWithDebInfo
        run: cmake --build release-work --parallel `nproc`

      - name: Install RelWithDebInfo
        run: cmake --install release-work --component core

      # - uses: actions/upload-artifact@v3
      #   with:
      #     name: ${{ github.sha }}
      #     overwrite: true
      #     path: |
      #       install

      - name: Upload release kernel
        if: github.ref == 'refs/heads/master'
        run: |
          rclone copyto ${PWD}/install/release/boot :s3,provider=Minio,env_auth=true:ipxe/boot \
            --s3-endpoint=https://minio.burntcomma.com \
            --s3-upload-concurrency 8 \
            --s3-chunk-size 64M \
            --s3-disable-checksum \
            --s3-no-check-bucket \
            --stats-log-level NOTICE --stats 1h --stats-one-line
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.S3_ACCESS_KEY}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.S3_SECRET_KEY}}

      - name: Cache userspace
        if: github.ref == 'refs/heads/master'
        run: cp -av install/release/. /cache/userspace-${GITHUB_RUN_ID}/

  upload-initrd:
    needs: x86_64 GCC
    if: github.ref == 'refs/heads/master'
    runs-on: moxnox-ci-amd64
    container:
      volumes:
        - moxnox-cache:/cache
    concurrency:
      group: minio-upload
    steps:
      - name: Download initrd
        run: |
          rclone copyto :s3,provider=Minio,env_auth=true:ipxe/initrd ${PWD}/initrd \
            --s3-endpoint=https://minio.burntcomma.com \
            --stats-log-level NOTICE --stats 1h --stats-one-line
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.S3_ACCESS_KEY}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.S3_SECRET_KEY}}

      - name: Extract initrd
        run: cpio -idm --no-absolute-filenames -D ${PWD}/root < ${PWD}/initrd

      - name: Copy files
        run: |
          cp -av /cache/userspace-${GITHUB_RUN_ID}/. root/
          rm root/boot
          rm root/initrd

      - name: Repack initrd
        run: cd root && find . -print0 | cpio --null --create --format=newc > ../initrd

      - name: Upload initrd
        run: |
          rclone copyto ${PWD}/initrd :s3,provider=Minio,env_auth=true:ipxe/initrd \
            --s3-endpoint=https://minio.burntcomma.com \
            --s3-upload-concurrency 8 \
            --s3-chunk-size 64M \
            --s3-disable-checksum \
            --s3-no-check-bucket \
            --stats-log-level NOTICE --stats 1h --stats-one-line
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.S3_ACCESS_KEY}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.S3_SECRET_KEY}}

      - name: Clean up cache
        run: rm -rf /cache/userspace-${GITHUB_RUN_ID}/
