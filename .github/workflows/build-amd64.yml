name: build
on:
  push:
    paths-ignore:
      - 'docker/**'
      - 'ports/**'
concurrency:
  group: build-amd64
jobs:
  x86_64 Clang:
    runs-on: ubuntu-moxnox
    steps:
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.SHORT_SHA }}
          fetch-depth: 1

      - name: Checkout submodules
        working-directory: ${{ env.SHORT_SHA }}
        run: |
          git submodule update --init --depth 1 ports/acpica/repo ports/freetype/repo ports/gnu-efi/repo ports/harfbuzz/repo ports/libpng/repo ports/mingw-w64/repo ports/zlib/repo ports/musl/repo

      - name: Configure Debug
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=clang-amd64.cmake \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=${PWD}/install/debug \
            -S ${SHORT_SHA} -B debug-work

      - name: Build Debug
        run: cmake --build debug-work --parallel `nproc`

      - name: Install Debug
        run: cmake --install debug-work --component core

      - name: Configure RelWithDebInfo
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=clang-amd64.cmake \
            -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=${PWD}/install/release \
            -S ${SHORT_SHA} -B release-work

      - name: Build RelWithDebInfo
        run: cmake --build release-work --parallel `nproc`

      - name: Install RelWithDebInfo
        run: cmake --install release-work --component core

      # - uses: actions/upload-artifact@v3
      #   with:
      #     name: ${{ github.sha }}
      #     overwrite: true
      #     path: |
      #       install

      - name: Upload debug kernel
        if: github.ref == 'refs/heads/master'
        run: |
          s3cmd --host=minio.burntcomma.com:443 \
            --host-bucket=minio.burntcomma.com:443 \
            put ${PWD}/install/debug/boot s3://ipxe/
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.S3_ACCESS_KEY}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.S3_SECRET_KEY}}

      - name: Cache userspace
        if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v3
        with:
          path: install/debug/
          key: userspace-${{ github.run_id }}

  upload-initrd:
    needs: x86_64 Clang
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-moxnox
    concurrency:
      group: minio-upload
    steps:
      - name: Restore userspace
        uses: actions/cache/restore@v3
        with:
          path: install/debug/
          key: userspace-${{ github.run_id }}

      - name: Download initrd
        run: |
          s3cmd --host=minio.burntcomma.com:443 \
            --host-bucket=minio.burntcomma.com:443 \
            get s3://ipxe/initrd ${PWD}/initrd
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.S3_ACCESS_KEY}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.S3_SECRET_KEY}}

      - name: Extract initrd
        run: cpio -idm --no-absolute-filenames -D ${PWD}/root < ${PWD}/initrd

      - name: Copy files
        run: |
          cp -av install/debug/. root/
          rm root/boot
          rm root/initrd

      - name: Repack initrd
        run: cd root && find . -print0 | cpio --null --create --format=newc > ../initrd

      - name: Upload initrd
        run: |
          s3cmd --host=minio.burntcomma.com:443 \
            --host-bucket=minio.burntcomma.com:443 \
            put ${PWD}/initrd s3://ipxe/initrd
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.S3_ACCESS_KEY}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.S3_SECRET_KEY}}
