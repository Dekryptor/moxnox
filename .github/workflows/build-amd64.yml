name: build
on:
  push:
    paths-ignore:
      - 'docker/**'
jobs:
  x86_64 Clang:
    runs-on: ubuntu-moxnox
    steps:
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.SHORT_SHA }}
          submodules: recursive
          fetch-depth: 1

      - name: Configure Debug
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=clang-amd64.cmake \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=${PWD}/install/debug \
            -DCMAKE_C_COMPILER_WORKS=TRUE \
            -DCMAKE_CXX_COMPILER_WORKS=TRUE \
            -S ${SHORT_SHA} -B debug-work

      - name: Build Debug
        run: cmake --build debug-work --parallel `nproc`

      - name: Install Debug
        run: cmake --install debug-work

      - name: Configure RelWithDebInfo
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=clang-amd64.cmake \
            -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=${PWD}/install/release \
            -DCMAKE_C_COMPILER_WORKS=TRUE \
            -DCMAKE_CXX_COMPILER_WORKS=TRUE \
            -S ${SHORT_SHA} -B release-work

      - name: Build RelWithDebInfo
        run: cmake --build release-work --parallel `nproc`

      - name: Install RelWithDebInfo
        run: cmake --install release-work

      # - uses: actions/upload-artifact@v3
      #   with:
      #     name: ${{ github.sha }}
      #     overwrite: true
      #     path: |
      #       install

      - name: Upload debug kernel
        run: |
          s3cmd --host=minio.burntcomma.com:443 \
            --host-bucket=minio.burntcomma.com:443 \
            put ${PWD}/install/debug/boot s3://ipxe/
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.S3_ACCESS_KEY}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.S3_SECRET_KEY}}

      - name: Upload debug initrd
        run: |
          s3cmd --host=minio.burntcomma.com:443 \
            --host-bucket=minio.burntcomma.com:443 \
            put ${PWD}/install/debug/initrd s3://ipxe/
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.S3_ACCESS_KEY}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.S3_SECRET_KEY}}
